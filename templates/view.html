<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ZCOOL SCRATCH VIEW ONLY</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* ❌ เอา no-click เดิมออก แล้วใช้แบบนี้แทน */
.cell {
    pointer-events: none; /* ห้ามกดช่อง */
}

/* ให้ปุ่มกดได้ */
.allow-click {
    pointer-events: auto !important;
}
</style>

</head>

<body>

<div class="header">❄️ ZCOOL SCRATCH (VIEW MODE) ❄️</div>

<div class="topbar">

    <button class="allow-click" onclick="copyBoard()">📋 คัดลอกรูปตาราง</button>

    <!-- ⭐ เพิ่ม logout -->
    <button class="allow-click" onclick="window.location='/logout'">🚪 ออกจากระบบ</button>

</div>

<div class="wrap">

    <div class="board" id="board"></div>

    <div class="panel">

        <h3>🏆 รางวัลใหญ่</h3>
        <div id="big"></div>

        <h3>🎁 รางวัลปลอบใจ</h3>
        <div id="small"></div>

        <hr>

        <h3>📊 LOG</h3>
        <div id="log"></div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

<script>
/* ⭐ สำคัญ: โหลดข้อมูลเหมือนหน้า user */
document.addEventListener("DOMContentLoaded", () => {
    updateLog();  // โหลดครั้งแรก
});

/* ⭐ realtime เหมือนหน้า user */
setInterval(updateLog, 2000);

/* ❌ ลบ modal ออก */
document.getElementById("modal")?.remove();

/* ❌ กัน Enter */
document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") e.preventDefault();
});
</script>

</body>
</html>
